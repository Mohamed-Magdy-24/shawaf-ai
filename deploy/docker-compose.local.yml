version: '3.8'

networks:
  surveillance_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  pgdata:
  snapshots_data:

services:
  postgres:
    image: postgres:16.6-alpine
    container_name: surveillance-postgres
    mem_limit: 512m
    environment:
      POSTGRES_DB: surveillance_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_master_dev_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/01-init-roles.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - surveillance_net
    command: postgres -c shared_buffers=128MB -c max_connections=50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d surveillance_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

  mediamtx:
    image: bluenviron/mediamtx:v1.9.3
    container_name: surveillance-mediamtx
    mem_limit: 128m
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "127.0.0.1:8554:8554"
    networks:
      - surveillance_net

  go2rtc:
    image: alexxit/go2rtc:v1.9.4
    container_name: surveillance-go2rtc
    mem_limit: 128m
    volumes:
      - ./go2rtc/go2rtc.yaml:/config/go2rtc.yaml:ro
    expose:
      - "1984" # INTERNAL ONLY: Port 1984 NOT published to host (ADR-012/ADR-014/Step 4.2)
    ports:
      - "127.0.0.1:8555:8555" # WebRTC media port
    networks:
      - surveillance_net
    depends_on:
      - mediamtx

  camsim:
    image: jrottenberg/ffmpeg:4.4-alpine
    container_name: surveillance-camsim
    mem_limit: 512m
    volumes:
      - ../data/synthetic:/data/synthetic:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "until nc -z mediamtx 8554; do sleep 1; done;
       ffmpeg -re -stream_loop -1 -i /data/synthetic/test_stream_01.mp4 -c copy -f rtsp rtsp://mediamtx:8554/bnf/camera01 &
       ffmpeg -re -stream_loop -1 -i /data/synthetic/test_stream_02.mp4 -c copy -f rtsp rtsp://mediamtx:8554/rnf/camera01;
       wait"
    networks:
      - surveillance_net
    depends_on:
      - mediamtx

  edged:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: surveillance-edged
    mem_limit: 256m
    environment:
      DATABASE_URL: "postgres://app_runtime:runtime_secret_dev_pass@postgres:5432/surveillance_dev?sslmode=disable"
      MIGRATOR_DATABASE_URL: "postgres://app_migrator:migrator_secret_dev_pass@postgres:5432/surveillance_dev?sslmode=disable"
      GRPC_LISTEN_ADDR: ":50051"
      HTTP_LISTEN_ADDR: ":8080"
      GO2RTC_API_URL: "http://go2rtc:1984"
      SHARED_SECRET_TOKEN: "dev_shared_secret_token_change_in_prod"
      SNAPSHOT_BASE_DIR: "/var/lib/surveillance/snapshots"
    volumes:
      - snapshots_data:/var/lib/surveillance/snapshots
    ports:
      - "127.0.0.1:8080:8080"
    expose:
      - "50051"
    networks:
      - surveillance_net
    depends_on:
      postgres:
        condition: service_healthy

  ai-worker:
    build:
      context: ../ai-workers
      dockerfile: Dockerfile
    container_name: surveillance-ai-worker
    mem_limit: 1536m
    environment:
      EDGED_GRPC_TARGET: "edged:50051"
      SHARED_SECRET_TOKEN: "dev_shared_secret_token_change_in_prod"
      SNAPSHOT_BASE_DIR: "/var/lib/surveillance/snapshots"
      PYTHONUNBUFFERED: "1"
    volumes:
      - snapshots_data:/var/lib/surveillance/snapshots
    networks:
      - surveillance_net
    depends_on:
      - edged
      - camsim
