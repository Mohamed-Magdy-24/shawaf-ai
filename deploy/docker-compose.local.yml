services:
  postgres:
    image: postgres:16-alpine
    container_name: surv_postgres
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-surveillance}
      POSTGRES_USER: ${POSTGRES_SUPER_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD:-local_dev_super_secret_change_me}
      POSTGRES_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER:-app_migrator}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:-local_dev_migrator_secret_change_me}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-app_runtime}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:-local_dev_runtime_secret_change_me}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/01-init-roles.sh:ro
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPER_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - surv_net

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: surv_mediamtx
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "8554:8554"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    networks:
      - surv_net

  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: surv_go2rtc
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "1984:1984"
      - "8555:8555"
    volumes:
      - ./go2rtc/go2rtc.yaml:/config/go2rtc.yaml:ro
    depends_on:
      - mediamtx
    networks:
      - surv_net

  edged:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: surv_edged
    restart: unless-stopped
    mem_limit: 256m
    environment:
      EDGED_HTTP_ADDR: ${EDGED_HTTP_ADDR:-:8080}
      EDGED_GRPC_ADDR: ${EDGED_GRPC_ADDR:-:50051}
      EDGED_JWT_SECRET: ${EDGED_JWT_SECRET:-local_dev_jwt_hmac_secret_32bytes_min_0001}
      EDGED_VIDEO_GRANT_SECRET: ${EDGED_VIDEO_GRANT_SECRET:-local_dev_video_grant_hmac_secret_32bytes_02}
      EDGED_WORKER_SHARED_TOKEN: ${EDGED_WORKER_SHARED_TOKEN:-local_dev_worker_grpc_shared_secret_token_03}
      EDGED_EVIDENCE_DIR: ${EDGED_EVIDENCE_DIR:-/var/lib/surveillance/evidence}
      EDGED_COVERAGE_LOST_TIMEOUT_SEC: ${EDGED_COVERAGE_LOST_TIMEOUT_SEC:-15}
      POSTGRES_DSN: "postgres://${POSTGRES_RUNTIME_USER:-app_runtime}:${POSTGRES_RUNTIME_PASSWORD:-local_dev_runtime_secret_change_me}@postgres:5432/${POSTGRES_DB:-surveillance}?sslmode=disable"
      GO2RTC_INTERNAL_URL: ${GO2RTC_INTERNAL_URL:-http://go2rtc:1984}
      SITE_BNF_ID: ${SITE_BNF_ID:-11111111-1111-1111-1111-111111111111}
      SITE_RNF_ID: ${SITE_RNF_ID:-22222222-2222-2222-2222-222222222222}
    ports:
      - "8080:8080"
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - evidence_data:/var/lib/surveillance/evidence
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - surv_net

  ai-worker:
    build:
      context: ../ai-workers
      dockerfile: Dockerfile
    container_name: surv_ai_worker
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      EDGED_GRPC_ADDR: edged:50051
      EDGED_WORKER_SHARED_TOKEN: ${EDGED_WORKER_SHARED_TOKEN:-local_dev_worker_grpc_shared_secret_token_03}
      MEDIAMTX_RTSP_BASE: ${MEDIAMTX_RTSP_BASE:-rtsp://mediamtx:8554}
      SITE_ID: ${SITE_BNF_ID:-11111111-1111-1111-1111-111111111111}
      CAMERAS: "bnf_cam_01,bnf_cam_02"
      ONNX_MODEL_PATH: "/app/models/cleanroom_yolox_nano_fp32.onnx"
      EVIDENCE_DIR: "/var/lib/surveillance/evidence"
    depends_on:
      - edged
      - mediamtx
    volumes:
      - evidence_data:/var/lib/surveillance/evidence
      - ../data/models:/app/models:ro
    networks:
      - surv_net

volumes:
  pg_data:
  evidence_data:

networks:
  surv_net:
    driver: bridge
