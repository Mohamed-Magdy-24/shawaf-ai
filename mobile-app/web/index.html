<!DOCTYPE html>
<html lang="en" class="notranslate" translate="no">

<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate" />
  <meta name="googlebot" content="notranslate" />
  <meta name="robots" content="notranslate" />
  <meta http-equiv="Content-Language" content="en">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SHAWAF AI — Industrial AI Surveillance & Autonomous Safety Platform">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SHAWAF AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title class="notranslate" translate="no">SHAWAF AI — Industrial Control Room</title>
  <link rel="manifest" href="manifest.json">

  <style>
    .notranslate {
      translate: no !important;
    }
    body {
      background-color: #0D0F13;
      margin: 0;
      padding: 0;
    }
  </style>

  <script>
    // 1. Force unregister any legacy service workers and clear cache storage
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }

    // 2. Prevent automated translation engines from modifying document
    document.documentElement.setAttribute('translate', 'no');
    document.documentElement.classList.add('notranslate');
  </script>
</head>

<body class="notranslate" translate="no">
  <script>
    {{flutter_bootstrap_js}}
  </script>
</body>

</html>
